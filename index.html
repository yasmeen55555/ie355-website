       .container {
    background: linear-gradient(145deg, #ffffff, #fffafd);
    width: 60%;
    margin: auto;
    padding: 45px;
    border-radius: 25px;
    border: 3px solid #f3a0bd;
    outline: 7px solid #ffe0eb;

    box-shadow:
        0 10px 30px rgba(232, 93, 145, 0.18),

}
/* GIRLY TOP DECORATION */

.top-decoration {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin-bottom: 25px;
    font-size: 32px;
}

.top-decoration .main-bow {
    font-size: 65px;
    display: inline-block;
    animation: bowFloat 2.5s ease-in-out infinite;
}

.top-decoration .small-bow {
    font-size: 38px;
    display: inline-block;
    animation: bowFloat 3s ease-in-out infinite;
}

.top-decoration .heart {
    color: #e85d91;
    font-size: 30px;
    display: inline-block;
    animation: heartBeat 1.7s ease-in-out infinite;
}

@keyframes bowFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.25);
    }
}
        a {
            display: block;
            background-color: #f7d6df;
            color: #6d4c55;
            text-decoration: none;
            padding: 12px;
            margin: 15px auto;
            width: 200px;
            border-radius: 10px;
        }

        a:hover {
            background-color: #efbdca;
        }
    </style>
</head>

<body>
