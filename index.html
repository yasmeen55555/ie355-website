       .container {
    background: linear-gradient(145deg, #fff0f5, #ffdce8, #fff0f5);
    width: 60%;
    margin: auto;
    padding: 45px;
    border-radius: 25px;
    border: 3px solid #f3a0bd;
    outline: 7px solid #ffe0eb;
    outline-offset: 5px;

        0 10px 30px rgba(232, 93, 145, 0.18),

           position: relative;
overflow: hidden;
}
/* GIRLY TOP DECORATION */

.top-decoration {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin-bottom: 25px;
    font-size: 32px;
}

.top-decoration .main-bow {
    font-size: 65px;
    display: inline-block;
    animation: bowFloat 2.5s ease-in-out infinite;
}

.top-decoration .small-bow {
    font-size: 38px;
    display: inline-block;
    animation: bowFloat 3s ease-in-out infinite;
}

.top-decoration .heart {
    color: #e85d91;
    font-size: 30px;
    display: inline-block;
    animation: heartBeat 1.7s ease-in-out infinite;
}

@keyframes bowFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.25);
    }
}
        a {
            display: block;
            position: relative;
            background-color: #f7d6df;
            color: #6d4c55;
            text-decoration: none;
            padding: 12px;
            margin: 15px auto;
            width: 200px;
            border-radius: 10px;
            border: 2px solid #f3a0bd;
outline: 2px solid #ffe4ee;
outline-offset: 3px;
        }

        a:hover {
            background-color: #efbdca;
        }

        a::before {
    content: "♡ ✦";
    position: absolute;
    left: -32px;
    top: 50%;
    transform: translateY(-50%);
    color: #e85d91;
    font-size: 17px;
}

a::after {
    content: "✦ ♡";
    position: absolute;
    right: -32px;
    top: 50%;
    transform: translateY(-50%);
    color: #e85d91;
    font-size: 17px;
}

        /* FLOATING HEARTS AND SPARKLES */

.floating-decor {
    position: absolute;
    font-size: 24px;
    color: #ee7faa;
    pointer-events: none;
    opacity: 0.65;
    animation: floatAround 5s ease-in-out infinite;
}

@keyframes floatAround {
    0%, 100% {
        transform: translate(0, 0) rotate(0deg);
    }

    25% {
        transform: translate(12px, -12px) rotate(8deg);
    }

    50% {
        transform: translate(-8px, -25px) rotate(-6deg);
    }

    75% {
        transform: translate(10px, -10px) rotate(5deg);
    }
}

        /* BIG STATIONARY HEARTS */

.big-background-heart {
    position: absolute;
    font-size: 220px;
    color: #f4a9c4;
    opacity: 0.16;
    pointer-events: none;
    z-index: 0;
}

.big-heart-left {
    left: 4%;
    top: 32%;
    transform: rotate(-12deg);
}

.big-heart-right {
    right: 4%;
    top: 48%;
    transform: rotate(12deg);
}

.container > *:not(.big-background-heart) {
    position: relative;
    z-index: 1;
}

        /* CELEBRATION FALLING HEARTS */

.celebration {
    position: absolute;
    top: -50px;
    font-size: 22px;
    pointer-events: none;
    z-index: 2;
    opacity: 0.7;
    animation: celebrationFall 8s linear infinite;
}

@keyframes celebrationFall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 0.7;
    }

    100% {
        transform: translateY(750px) rotate(360deg);
        opacity: 0;
    }
}
    </style>
